[package]
name = "xiaofanqie"
version = "0.2.0"
description = "小番茄桌面宠物与专注助手"
authors = ["小番茄"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xiaofanqie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
