<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">小番茄使用流程</title>
  <desc id="desc">下载、建立 Todo、开始番茄钟、同步数据四步流程</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b181d"/><stop offset="1" stop-color="#312938"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff916f"/><stop offset="1" stop-color="#d95b6b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <text x="64" y="70" fill="#fff8f4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">从打开到开始专注，只需要四步</text>
  <text x="64" y="104" fill="#bfb1b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">Download  →  Plan  →  Focus  →  Sync</text>

  <g filter="url(#shadow)">
    <rect x="58" y="150" width="250" height="286" rx="24" fill="#28242b" stroke="#51474f"/>
    <rect x="336" y="150" width="250" height="286" rx="24" fill="#28242b" stroke="#51474f"/>
    <rect x="614" y="150" width="250" height="286" rx="24" fill="#28242b" stroke="#51474f"/>
    <rect x="892" y="150" width="250" height="286" rx="24" fill="#28242b" stroke="#51474f"/>
  </g>
  <path d="M309 230 h23 M587 230 h23 M865 230 h23" stroke="#716374" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M323 220 l14 10 -14 10 M601 220 l14 10 -14 10 M879 220 l14 10 -14 10" fill="none" stroke="#716374" stroke-width="3"/>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(82 184)"><circle cx="42" cy="42" r="42" fill="url(#accent)"/><text x="42" y="54" text-anchor="middle" fill="#fff8f4" font-size="30" font-weight="700">1</text><text x="0" y="122" fill="#fff8f4" font-size="25" font-weight="700">下载</text><text x="0" y="160" fill="#c8bdc2" font-size="16">打开 Release</text><text x="0" y="188" fill="#c8bdc2" font-size="16">下载 Windows EXE</text><text x="0" y="216" fill="#c8bdc2" font-size="16">便携版，双击即用</text><text x="0" y="244" fill="#ff765e" font-size="15" font-weight="700">无需安装向导</text></g>
    <g transform="translate(360 184)"><circle cx="42" cy="42" r="42" fill="#6c5bd4"/><text x="42" y="54" text-anchor="middle" fill="#fff8f4" font-size="30" font-weight="700">2</text><text x="0" y="122" fill="#fff8f4" font-size="25" font-weight="700">写任务</text><text x="0" y="160" fill="#c8bdc2" font-size="16">点击「记一件事」</text><text x="0" y="188" fill="#c8bdc2" font-size="16">分组或标星</text><text x="0" y="216" fill="#c8bdc2" font-size="16">任务右键可编辑</text><text x="0" y="244" fill="#8e7cf7" font-size="15" font-weight="700">保存后立即显示</text></g>
    <g transform="translate(638 184)"><circle cx="42" cy="42" r="42" fill="#49a879"/><text x="42" y="54" text-anchor="middle" fill="#fff8f4" font-size="30" font-weight="700">3</text><text x="0" y="122" fill="#fff8f4" font-size="25" font-weight="700">专注</text><text x="0" y="160" fill="#c8bdc2" font-size="16">右键宠物</text><text x="0" y="188" fill="#c8bdc2" font-size="16">开启番茄钟</text><text x="0" y="216" fill="#c8bdc2" font-size="16">倒计时牌随宠物出现</text><text x="0" y="244" fill="#62d09b" font-size="15" font-weight="700">结束会撒花</text></g>
    <g transform="translate(916 184)"><circle cx="42" cy="42" r="42" fill="#d18d55"/><text x="42" y="54" text-anchor="middle" fill="#fff8f4" font-size="30" font-weight="700">4</text><text x="0" y="122" fill="#fff8f4" font-size="25" font-weight="700">同步</text><text x="0" y="160" fill="#c8bdc2" font-size="16">设置 CSV 路径</text><text x="0" y="188" fill="#c8bdc2" font-size="16">放进同步云盘</text><text x="0" y="216" fill="#c8bdc2" font-size="16">换电脑继续用</text><text x="0" y="244" fill="#e4a96f" font-size="15" font-weight="700">建议使用云盘</text></g>
  </g>
  <text x="64" y="480" fill="#8e7cf7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">LOCAL FIRST</text><text x="214" y="480" fill="#bfb1b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Todo 数据保存在本地</text>
</svg>
